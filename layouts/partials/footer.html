{{- /* Port of components/footer.tsx */ -}}
{{- $site := hugo.Data.site -}}
<footer class="flex w-full flex-col items-center mb-10 px-4 text-center text-gray-500 dark:text-gray-300">
  <small class="mb-2 test-xs block">
    {{ T "copyright" }} &copy; {{ $site.copyrightYear }} {{ $site.copyrightName }}. {{ T "allRightsReserved" }}
  </small>
  <p class="text-xs">
    <span class="font-semibold">{{ T "thisWebsite" }} </span> {{ $site.footer.builtWith | safeHTML }}
  </p>
  <p class="text-xs">{{ $site.footer.hostedOn }}</p>
</footer>
